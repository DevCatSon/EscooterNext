name: escooter_control
description: Independent cross-platform scooter companion by DevCatSon.
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  platform_features:
    path: packages/platform_features
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/scooter.png
    - assets/models/gyrocopters-g30.png
    - assets/scooter_catalog.json
xcross:
  bundle_id: prefixed

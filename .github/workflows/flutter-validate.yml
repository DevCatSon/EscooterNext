name: Build Escooter Next

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Candidate mode; release artifacts remain unsigned'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

env:
  BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'debug' }}

defaults:
  run:
    working-directory: flutter_app

jobs:
  plan:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.commits.outputs.list }}
    steps:
      - name: Select commits to build
        id: commits
        working-directory: .
        shell: python
        run: |
          import json
          import os
          import re

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  push = json.load(event_file)
              commits = list(dict.fromkeys([entry["id"] for entry in push["commits"]] + [push["after"]]))
          else:
              commits = [os.environ["GITHUB_SHA"]]

          if not all(re.fullmatch(r"[0-9a-f]{40}", commit) for commit in commits):
              raise SystemExit("Invalid commit ID")
          if len(commits) > 256:
              raise SystemExit("GitHub Actions can build at most 256 commits per push. Split large pushes.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("list=" + json.dumps(commits, separators=(",", ":")) + "\n")

  android:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Validate candidate mode
        run: |
          case "$BUILD_MODE" in debug|release) ;; *) exit 1 ;; esac
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/platform_features/lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk "--$BUILD_MODE" --split-per-abi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Escooter-Next-Android-${{ env.BUILD_MODE }}-${{ matrix.commit }}
          path: flutter_app/build/app/outputs/flutter-apk/*-${{ env.BUILD_MODE }}.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Validate candidate mode and record Xcode
        run: |
          case "$BUILD_MODE" in debug|release) ;; *) exit 1 ;; esac
          xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios "--$BUILD_MODE" --no-codesign
      - name: Archive unsigned app preserving bundle permissions
        run: |
          set -euo pipefail
          apps=(build/ios/iphoneos/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo 'Expected exactly one unsigned iOS app bundle.' >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" build/ios/Escooter-Next-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Escooter-Next-iOS-${{ env.BUILD_MODE }}-unsigned-${{ matrix.commit }}
          path: flutter_app/build/ios/Escooter-Next-unsigned.zip
          if-no-files-found: error
          retention-days: 7
